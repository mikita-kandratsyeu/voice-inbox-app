approvedGitRepositories:
  - '**'

# Pin registry for all workspaces (overrides machine-wide ~/.yarnrc.yml).
npmRegistryServer: "https://registry.npmjs.org"

enableScripts: true

nodeLinker: node-modules

# Keep dependencies inside each workspace (required for React Native autolinking in mobile/).
nmHoistingLimits: workspaces

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.16.0.cjs
