name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Checking node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock', '**/.yarnrc.yml') }}

      - name: Install packages
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint

      - name: Type Check
        run: yarn type:check

      - name: Test
        run: yarn test
