appId: com.mkandratsyeu.voiceinboxai
---
# Catalog flow: app-lock/enable-pin.yaml
- runFlow: ../../subflows/launch-e2e.yaml
- tapOn:
    id: tab.settings
    optional: true
- tapOn:
    id: settings.appLockSetup
    optional: true
- extendedWaitUntil:
    visible:
      id: settings.screen
    timeout: 20000
