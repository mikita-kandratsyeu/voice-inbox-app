appId: com.mkandratsyeu.voiceinboxai
---
# Catalog flow: record/save-meeting-mode.yaml
- runFlow: ../../subflows/launch-e2e.yaml
- tapOn:
    id: tab.record
- tapOn:
    id: record.stop
    optional: true
- tapOn:
    id: save.meetingToggle
    optional: true
- extendedWaitUntil:
    visible:
      id: save.confirm
    timeout: 20000
