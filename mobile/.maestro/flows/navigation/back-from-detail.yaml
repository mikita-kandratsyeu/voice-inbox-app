appId: com.mkandratsyeu.voiceinboxai
---
# Catalog flow: navigation/back-from-detail.yaml
- runFlow: ../../subflows/launch-e2e.yaml
- runFlow: ../../subflows/seed-text-note.yaml
- tapOn:
    id: inbox.recordCard.e2e-seed-note
    optional: true
- tapOn:
    id: detail.back
    optional: true
- extendedWaitUntil:
    visible:
      id: inbox.screen
    timeout: 20000
