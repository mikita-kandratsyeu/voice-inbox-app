appId: com.mkandratsyeu.voiceinboxai
---
# Catalog flow: debug/open-debug-screen.yaml
- runFlow: ../../subflows/launch-e2e.yaml
- tapOn:
    id: tab.settings
    optional: true
- tapOn:
    id: settings.debug
    optional: true
- extendedWaitUntil:
    visible:
      id: settings.screen
    timeout: 20000
