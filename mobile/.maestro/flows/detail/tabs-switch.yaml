appId: com.mkandratsyeu.voiceinboxai
---
# Catalog flow: detail/tabs-switch.yaml
- runFlow: ../../subflows/launch-e2e.yaml
- runFlow: ../../subflows/seed-text-note.yaml
- tapOn:
    id: inbox.recordCard.e2e-seed-note
    optional: true
- tapOn:
    id: detail.tab.summary
    optional: true
- tapOn:
    id: detail.tab.tasks
    optional: true
- extendedWaitUntil:
    visible:
      id: detail.screen
    timeout: 20000
