appId: com.mkandratsyeu.voiceinboxai
---
# Catalog flow: settings/navigate-trash.yaml
- runFlow: ../../subflows/launch-e2e.yaml
- tapOn:
    id: tab.settings
    optional: true
- tapOn:
    id: settings.trash
    optional: true
- extendedWaitUntil:
    visible:
      id: trash.screen
    timeout: 20000
