appId: com.mkandratsyeu.voiceinboxai
name: tab-navigation
---
# S03 — bottom tab navigation
- runFlow: ../../subflows/launch-e2e.yaml
- tapOn:
    id: tab.settings
- assertVisible:
    id: settings.screen
- tapOn:
    id: tab.inbox
- assertVisible:
    id: inbox.screen
- tapOn:
    id: tab.record
- assertVisible:
    id: record.timer
