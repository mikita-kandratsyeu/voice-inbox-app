appId: com.mkandratsyeu.voiceinboxai
name: text-note-crud
---
# S04 — text note create via deep link
- runFlow: ../../subflows/launch-e2e.yaml
- openLink: voiceinbox://note/text
- extendedWaitUntil:
    visible:
      id: textNote.screen
    timeout: 15000
- tapOn:
    id: textNote.titleInput
- inputText: 'Maestro E2E'
- tapOn:
    id: textNote.body
- inputText: 'Created by Maestro smoke test.'
- tapOn:
    id: textNote.save
- extendedWaitUntil:
    visible:
      id: inbox.screen
    timeout: 15000
- assertVisible:
    id: inbox.screen
