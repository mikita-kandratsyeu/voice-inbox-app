appId: com.mkandratsyeu.voiceinboxai
---
# S05 — open recording detail from seeded note
- runFlow: ../../subflows/launch-e2e.yaml
- runFlow: ../../subflows/seed-text-note.yaml
- tapOn:
    id: inbox.recordCard.e2e-seed-note
- extendedWaitUntil:
    visible:
      id: detail.screen
    timeout: 15000
- assertVisible:
    id: detail.tab.transcript
