name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mobile/node_modules
            .yarn/cache
            .turbo
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'mobile/package.json', 'web/package.json', 'telegram-bot/package.json') }}

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.16.0.cjs install --immutable

      - name: Lint
        id: lint
        run: |
          FILTER="voice-inbox-app"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run lint --filter="$FILTER"

      - name: Format check
        id: format
        run: |
          FILTER="voice-inbox-app"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run format:check --filter="$FILTER"

      - name: Typecheck
        id: typecheck
        run: |
          FILTER="voice-inbox-app"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run type:check --filter="$FILTER"

      - name: Test
        id: test
        run: |
          FILTER="voice-inbox-app"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn turbo run test --filter="$FILTER" -- --ci --forceExit --coverage --coverageReporters=json-summary --json --outputFile=test-results.json
          else
            yarn turbo run test --filter="$FILTER" -- --ci --forceExit
          fi

      - name: Collect PR metrics
        if: always() && github.event_name == 'pull_request'
        working-directory: mobile
        env:
          STEP_LINT_OUTCOME: ${{ steps.lint.outcome }}
          STEP_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          STEP_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node ../scripts/ci-pr-collect.mjs mobile

      - name: Upload PR metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-mobile
          path: ci-metrics/mobile.json
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            web/node_modules
            .yarn/cache
            .turbo
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'mobile/package.json', 'web/package.json', 'telegram-bot/package.json') }}

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.16.0.cjs install --immutable

      - name: Lint
        id: lint
        run: |
          FILTER="voice-inbox-web"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run lint --filter="$FILTER"

      - name: Typecheck
        id: typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: |
          FILTER="voice-inbox-web"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run type:check --filter="$FILTER"

      - name: Test
        id: test
        run: |
          FILTER="voice-inbox-web"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn turbo run test --filter="$FILTER" -- --ci --forceExit --coverage --coverageReporters=json-summary --json --outputFile=test-results.json
          else
            yarn turbo run test --filter="$FILTER" -- --ci --forceExit
          fi

      - name: Collect PR metrics
        if: always() && github.event_name == 'pull_request'
        working-directory: web
        env:
          STEP_LINT_OUTCOME: ${{ steps.lint.outcome }}
          STEP_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node ../scripts/ci-pr-collect.mjs web

      - name: Upload PR metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-web
          path: ci-metrics/web.json
          if-no-files-found: ignore

  telegram-bot:
    name: Telegram bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            telegram-bot/node_modules
            .yarn/cache
            .turbo
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'mobile/package.json', 'web/package.json', 'telegram-bot/package.json') }}

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.16.0.cjs install --immutable

      - name: Lint
        id: lint
        run: |
          FILTER="voice-inbox-telegram-bot"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run lint --filter="$FILTER"

      - name: Format check
        id: format
        run: |
          FILTER="voice-inbox-telegram-bot"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run format:check --filter="$FILTER"

      - name: Typecheck
        id: typecheck
        run: |
          FILTER="voice-inbox-telegram-bot"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          yarn turbo run type:check --filter="$FILTER"

      - name: Test
        id: test
        run: |
          FILTER="voice-inbox-telegram-bot"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="${FILTER}...[origin/main]"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn turbo run test --filter="$FILTER" -- --ci --forceExit --coverage --coverageReporters=json-summary --json --outputFile=test-results.json
          else
            yarn turbo run test --filter="$FILTER" -- --ci --forceExit
          fi

      - name: Collect PR metrics
        if: always() && github.event_name == 'pull_request'
        working-directory: telegram-bot
        env:
          STEP_LINT_OUTCOME: ${{ steps.lint.outcome }}
          STEP_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          STEP_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node ../scripts/ci-pr-collect.mjs telegram-bot

      - name: Upload PR metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-telegram-bot
          path: ci-metrics/telegram-bot.json
          if-no-files-found: ignore

  ci-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [mobile, web, telegram-bot]
    if: github.event_name == 'pull_request' && always()
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PR metrics
        uses: actions/download-artifact@v4
        with:
          path: ci-metrics
          pattern: ci-metrics-*
          merge-multiple: true

      - name: Generate summary
        env:
          JOB_MOBILE_RESULT: ${{ needs.mobile.result }}
          JOB_WEB_RESULT: ${{ needs.web.result }}
          JOB_TELEGRAM_BOT_RESULT: ${{ needs.telegram-bot.result }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-pr-summary.mjs > pr-summary.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          path: pr-summary.md
