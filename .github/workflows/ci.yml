name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-modules-${{ hashFiles('mobile/yarn.lock', 'mobile/.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn type:check

      - name: Test
        run: yarn test --ci --forceExit

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-web-modules-${{ hashFiles('web/yarn.lock', 'web/.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        env:
          # prisma.config.ts requires DATABASE_URL; prisma generate does not open a connection
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: yarn type:check

      - name: Test
        run: yarn test --ci --forceExit

  telegram-bot:
    name: Telegram bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: telegram-bot/node_modules
          key: ${{ runner.os }}-telegram-bot-modules-${{ hashFiles('telegram-bot/yarn.lock', 'telegram-bot/.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn type:check

      - name: Test
        run: yarn test --ci --forceExit
