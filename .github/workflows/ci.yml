name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-modules-${{ hashFiles('mobile/yarn.lock', 'mobile/.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        id: lint
        run: yarn lint

      - name: Format check
        id: format
        run: yarn format:check

      - name: Typecheck
        id: typecheck
        run: yarn type:check

      - name: Test
        id: test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn test --ci --forceExit --coverage --coverageReporters=json-summary --json --outputFile=test-results.json
          else
            yarn test --ci --forceExit
          fi

      - name: Collect PR metrics
        if: always() && github.event_name == 'pull_request'
        env:
          STEP_LINT_OUTCOME: ${{ steps.lint.outcome }}
          STEP_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          STEP_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node ../scripts/ci-pr-collect.mjs mobile

      - name: Upload PR metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-mobile
          path: ci-metrics/mobile.json
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-web-modules-${{ hashFiles('web/yarn.lock', 'web/.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        id: lint
        run: yarn lint

      - name: Typecheck
        id: typecheck
        env:
          # prisma.config.ts requires DATABASE_URL; prisma generate does not open a connection
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: yarn type:check

      - name: Test
        id: test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn test --ci --forceExit --coverage --coverageReporters=json-summary --json --outputFile=test-results.json
          else
            yarn test --ci --forceExit
          fi

      - name: Collect PR metrics
        if: always() && github.event_name == 'pull_request'
        env:
          STEP_LINT_OUTCOME: ${{ steps.lint.outcome }}
          STEP_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node ../scripts/ci-pr-collect.mjs web

      - name: Upload PR metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-web
          path: ci-metrics/web.json
          if-no-files-found: ignore

  telegram-bot:
    name: Telegram bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Restore yarn cache
        uses: actions/cache@v4
        with:
          path: telegram-bot/node_modules
          key: ${{ runner.os }}-telegram-bot-modules-${{ hashFiles('telegram-bot/yarn.lock', 'telegram-bot/.yarnrc.yml') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        id: lint
        run: yarn lint

      - name: Format check
        id: format
        run: yarn format:check

      - name: Typecheck
        id: typecheck
        run: yarn type:check

      - name: Test
        id: test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn test --ci --forceExit --coverage --coverageReporters=json-summary --json --outputFile=test-results.json
          else
            yarn test --ci --forceExit
          fi

      - name: Collect PR metrics
        if: always() && github.event_name == 'pull_request'
        env:
          STEP_LINT_OUTCOME: ${{ steps.lint.outcome }}
          STEP_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          STEP_TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node ../scripts/ci-pr-collect.mjs telegram-bot

      - name: Upload PR metrics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-telegram-bot
          path: ci-metrics/telegram-bot.json
          if-no-files-found: ignore

  ci-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [mobile, web, telegram-bot]
    if: github.event_name == 'pull_request' && always()
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PR metrics
        uses: actions/download-artifact@v4
        with:
          path: ci-metrics
          pattern: ci-metrics-*
          merge-multiple: true

      - name: Generate summary
        env:
          JOB_MOBILE_RESULT: ${{ needs.mobile.result }}
          JOB_WEB_RESULT: ${{ needs.web.result }}
          JOB_TELEGRAM_BOT_RESULT: ${{ needs.telegram-bot.result }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci-pr-summary.mjs > pr-summary.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          path: pr-summary.md
