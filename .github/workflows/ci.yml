name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    name: CI (Mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Checking node_modules cache
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-modules-${{ hashFiles('mobile/yarn.lock', 'mobile/.yarnrc.yml') }}

      - name: Install packages
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint

      - name: Type Check
        run: yarn type:check

      - name: Unit tests (Jest)
        run: yarn test --ci --forceExit

  web:
    name: CI (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Checking node_modules cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-web-modules-${{ hashFiles('web/yarn.lock', 'web/.yarnrc.yml') }}

      - name: Install packages
        run: yarn install --immutable

      - name: ESLint
        run: yarn lint
