name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security issues go to SECURITY.md, not here.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - mobile
        - web
        - telegram-bot
        - multiple / monorepo
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: e.g. 2.0.0 from package.json, or git SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: iOS / Android / browser / Node, OS version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs / screenshots
      description: Redact tokens, emails, and personal note content.
